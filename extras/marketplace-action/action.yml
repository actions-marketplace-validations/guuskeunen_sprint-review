name: Sprint Review Deck
description: Turn a sprint's git history into a sprint review deck anyone can follow. AI writes the words, code checks every line against the real commits.
author: Guus Keunen
branding:
  icon: monitor
  color: orange

# This repository only exists to list the action on GitHub Marketplace (which doesn't allow
# workflow files in an action's repository). Everything happens in guuskeunen/sprint-review.

inputs:
  anthropic-api-key:
    description: Your Anthropic API key. Store it as a repository secret. Required unless you use openai-api-key with model.provider openai.
    required: false
    default: ''
  openai-api-key:
    description: Your OpenAI API key, for model.provider openai in the config.
    required: false
    default: ''
  github-token:
    description: Token to read pull request titles and descriptions as context. Empty string turns it off.
    required: false
    default: ${{ github.token }}
  config:
    description: Path to the config file. Default sprint-review.config.yml (or .yaml/.json), or built-in defaults when there is none.
    required: false
    default: ''
  since:
    description: First day of the sprint (YYYY-MM-DD). Default the sprint ending today, from sprint.days in the config.
    required: false
    default: ''
  until:
    description: Last day of the sprint (YYYY-MM-DD). Default today.
    required: false
    default: ''
  from:
    description: Start at a tag or commit instead of a date, such as the previous release tag.
    required: false
    default: ''
  to:
    description: End at a tag or commit. Default HEAD.
    required: false
    default: ''
  out:
    description: Folder to write to. Default sprint-reviews/<date>.
    required: false
    default: ''
  pptx:
    description: Also write deck.pptx, an editable PowerPoint.
    required: false
    default: 'false'
  slack:
    description: Post the summary to Slack. Set SLACK_WEBHOOK_URL in the step's env from a secret.
    required: false
    default: 'false'
  deck-url:
    description: Link to the published deck, for the button in the Slack message.
    required: false
    default: ''
  summary:
    description: Add the review and its checks to the job summary.
    required: false
    default: 'true'
  version:
    description: The version of @guuskeunen/sprint-review to run.
    required: false
    default: '0'


outputs:
  deck:
    description: See guuskeunen/sprint-review.
    value: ${{ steps.run.outputs.deck }}
  review:
    description: See guuskeunen/sprint-review.
    value: ${{ steps.run.outputs.review }}
  markdown:
    description: See guuskeunen/sprint-review.
    value: ${{ steps.run.outputs.markdown }}
  checks:
    description: See guuskeunen/sprint-review.
    value: ${{ steps.run.outputs.checks }}
  pptx:
    description: See guuskeunen/sprint-review.
    value: ${{ steps.run.outputs.pptx }}
  dir:
    description: See guuskeunen/sprint-review.
    value: ${{ steps.run.outputs.dir }}

runs:
  using: composite
  steps:
    - id: run
      uses: guuskeunen/sprint-review@v0
      with:
        anthropic-api-key: ${{ inputs.anthropic-api-key }}
        openai-api-key: ${{ inputs.openai-api-key }}
        github-token: ${{ inputs.github-token }}
        config: ${{ inputs.config }}
        since: ${{ inputs.since }}
        until: ${{ inputs.until }}
        from: ${{ inputs.from }}
        to: ${{ inputs.to }}
        out: ${{ inputs.out }}
        pptx: ${{ inputs.pptx }}
        slack: ${{ inputs.slack }}
        deck-url: ${{ inputs.deck-url }}
        summary: ${{ inputs.summary }}
        version: ${{ inputs.version }}
