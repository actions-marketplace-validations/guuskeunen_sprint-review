name: Release

# Every push to main updates a release pull request with the next version and its changelog,
# written from the Conventional Commit messages. Merging that pull request tags the release,
# publishes to npm with provenance, attaches the MCP bundle (sprint-review.mcpb), publishes to the MCP
# registry, and moves the v0 tag that `uses: guuskeunen/sprint-review@v0` follows.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
      major: ${{ steps.release.outputs.major }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: needs.release-please.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write   # npm trusted publishing and the MCP registry: sign in with a short-lived GitHub token
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24   # trusted publishing needs npm 11.5.1 or newer; Node 22 ships npm 10
          registry-url: https://registry.npmjs.org
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # No token: npm trusts this workflow (set up on npmjs.com under the package's trusted publishers).
      - run: npm publish --access public
      - name: Attach the MCP bundle (.mcpb) to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag }}
        run: |
          node scripts/build-mcpb.ts
          gh release upload "$TAG" sprint-review.mcpb --clobber
      - name: Move the major version tag
        env:
          MAJOR: v${{ needs.release-please.outputs.major }}
        run: |
          git tag -f "$MAJOR"
          git push -f origin "$MAJOR"
      # The registry lists the npm package, so it goes last: npm can take several minutes to show a new
      # version ("being processed"). No token: the registry trusts this workflow.
      - name: Publish to the MCP registry
        env:
          VERSION: ${{ needs.release-please.outputs.tag }}
        run: |
          for i in $(seq 1 40); do npm view "@guuskeunen/sprint-review@${VERSION##*v}" version >/dev/null 2>&1 && break; echo "Waiting for npm to show ${VERSION##*v}"; sleep 15; done
          curl -sL https://github.com/modelcontextprotocol/registry/releases/download/v1.8.12/mcp-publisher_linux_amd64.tar.gz | tar xz mcp-publisher
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
