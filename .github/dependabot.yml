# Weekly update PRs for npm packages and GitHub Actions.
# npm updates are "fix(deps)" so release-please ships them in the next patch release;
# a security fix in sharp or pptxgenjs then reaches users without a manual release.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: fix(deps)
      prefix-development: chore(deps-dev)
    groups:
      dev:
        dependency-type: development
    ignore:
      # typescript-eslint supports TypeScript below 6.1: take a TypeScript major only when it does.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # Node types stay on 22, the oldest Node the tests run on, so code cannot use newer Node APIs.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(ci)
