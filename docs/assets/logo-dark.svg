  <rect x="1" y="1" width="126" height="126" rx="30" fill="url(#bg)"/>
  <rect x="1.75" y="1.75" width="124.5" height="124.5" rx="29.25" fill="none" stroke="url(#rim)" stroke-width="1.5" opacity=".85"/>
  <!-- the slide behind: the commits -->
  <rect x="36" y="27" width="64" height="46" rx="9" fill="#24242b" stroke="#3a3a44" stroke-width="1"/>
  <rect x="44" y="37" width="24" height="3.5" rx="1.75" fill="#5b5b66"/>
  <rect x="44" y="45" width="38" height="3.5" rx="1.75" fill="#5b5b66"/>
  <!-- the slide in front: the review -->
