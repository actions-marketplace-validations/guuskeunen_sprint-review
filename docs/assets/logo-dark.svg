  <circle cx="38" cy="63" r="7.5" fill="url(#gold)"/>
  <path d="M34.4 63.2l2.5 2.5 4.6-4.8" fill="none" stroke="#1a150c" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="50" y="59.5" width="34" height="5" rx="2.5" fill="#16161b"/>
  <rect x="32" y="75" width="52" height="4" rx="2" fill="#cfc6b4"/>
  <rect x="32" y="84" width="38" height="4" rx="2" fill="#cfc6b4"/>
