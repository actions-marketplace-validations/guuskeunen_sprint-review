<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 128" role="img" aria-label="sprint-review">
  <defs>
    <radialGradient id="bg" cx=".3" cy=".18" r="1.05">
      <stop offset="0" stop-color="#26231d"/>
      <stop offset=".55" stop-color="#121216"/>
      <stop offset="1" stop-color="#0a0a0d"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3dfae"/>
      <stop offset=".45" stop-color="#b8914a"/>
      <stop offset="1" stop-color="#5e4a26"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbe9bf"/>
      <stop offset=".5" stop-color="#d6b36a"/>
      <stop offset="1" stop-color="#9c7a3c"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
