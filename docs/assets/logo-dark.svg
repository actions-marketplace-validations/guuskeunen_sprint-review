  <path d="M101 28c1.7 6.6 4.4 9.3 11 11c-6.6 1.7-9.3 4.4-11 11c-1.7-6.6-4.4-9.3-11-11c6.6-1.7 9.3-4.4 11-11z" fill="url(#gold)"/>

