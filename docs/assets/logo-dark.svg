  <text x="158" y="106" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="600" letter-spacing="4.5" fill="#c9a95f">YOUR SPRINT, WRITTEN FROM GIT</text>
